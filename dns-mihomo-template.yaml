# mihomo 完整配置模板 — 由 D:\ClaudeCode\projects\main\clash-rules\DNS.ini (subconverter INI) 翻译
# 翻译日期: 2026-11-23 | 规则顺序、分组结构忠实还原 DNS.ini (f525ba8)
# 用法: Sub-Store「文件」功能托管；客户端订阅链接 = /api/file/dns-mihomo?type=mihomoConfig&sourceType=subscription&sourceName=<订阅名>
# 节点注入: mihomoConfig 类型会把 source 订阅的节点自动写入 proxies 并按脚本处理；分组内 use/include-all 由下方脚本段补齐

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ---------- DNS（DNS.ini 原版无 dns 段，老 subconverter 也不生成 dns；以下为 mihomo 防泄漏推荐配置）----------
dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

