# mihomo 完整配置模板 — 由 D:\ClaudeCode\projects\main\clash-rules\DNS.ini (subconverter INI) 翻译
# 翻译日期: 2026-11-23 | 规则顺序、分组结构忠实还原 DNS.ini (f525ba8)
# 用法: Sub-Store「文件」(type=mihomoConfig) 以本文件为远程模板，process 里挂一个
#       「Add Proxies From Subscription Operator」把订阅/组合订阅的节点写入 proxies。
#       客户端订阅链接 = https://<sub-store>/…/api/file/dns-mihomo
# 节点注入: 由上述操作符完成；本文件不含 proxies 段。分组用 include-all 自动收录全部节点。
# 维护: 改规则直接改本文件并推送。Sub-Store 对本远程模板有磁盘持久化缓存, 默认 1 小时
#       (源码 $Y(): resourceCacheTtl 缺省 36e5 ms), 推送后最多 1 小时生效;
#       客户端订阅链接加 ?noCache=1 可立即绕过缓存。
#
# 【2026-11-23 23:52 起: 规则改由 Sub-Store 的「脚本操作」提供, 不再读本文件这三段】
#   文件条目 dns-mihomo 的「文件操作」里现在有两个步骤:
#     1. Add Proxies From Subscription Operator  —— 把组合订阅「全部机场」的节点写进 proxies
#     2. Script Operator (内容类型: 本地内容)     —— 整体替换 proxy-groups / rule-providers / rules
#   也就是本文件的 rule-providers / proxy-groups / rules 三段在线上输出里已被脚本覆盖, 只在脚本
#   被停用时才会生效(兜底)。**以后改规则去面板: 文件 → dns-mihomo → 文件操作 → 脚本操作**,
#   改完立即生效, 不用推送、不受 1 小时缓存影响。本文件只负责基础设置(mixed-port / allow-lan /
#   mode / log-level / external-controller)。
#   脚本副本留档: phoenix /root/sub-store/rules/dns-rules.js
#   脚本相对本文件的三处差异(都有实测依据, 详见脚本头部注释):
#     a. 规则集走 testingcf.jsdelivr.net。本文件的 raw.githubusercontent.com 在国内网络直连被重置,
#        客户端拉不到规则集(2026-11-23 本机实测), 内核只记一条 error, 该规则集整组失效。
#     b. Scholar 的 gist 地址去掉了钉死的版本号。旧版本号已被 GitHub 回收(所有镜像 404),
#        内容没变(sha256 相同)。
#     c. 规则 105 条 = DNS.ini 的 101 条 + Sparkle 覆写里多出的 4 条(openrouter.ai / anyrouter.top /
#        emby.cloud.us.kg / 11.102.6.5 → 节点选择)。

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ---------- DNS ----------
# 【2026-11-23 事故修复】原先这里有一段"防泄漏推荐 dns"(fallback 指向 1.1.1.1 / 8.8.8.8 的 DoH)。
#   后果: 这两个地址从国内直连不通; mihomo 对判定为境外的域名优先采用 fallback 的结果,
#   fallback 超时 => 节点服务器域名解析失败 => 68 个节点里 57 个连不上(实测 A/B: 11 通 vs 65 通)。
#   现在整段删除, 交给客户端自己的 DNS 设置。客户端若需要 dns 段, 用客户端的覆写/全局配置来加,
#   不要写进本模板。
#
# ---------- 远程规则集（对应 DNS.ini 的全部远程 ruleset URL，共 12 个）----------
# 【重要】behavior / format 取决于文件内容格式，不取决于名字里有没有 IP：
#   - ACL4SSR / blackmatrix7 / gist 的 .list 是 classic 风格的完整规则行（如 "DOMAIN-SUFFIX,x.com"、"IP-CIDR,1.2.3.0/24,no-resolve"）
#     → 必须 behavior: classical + format: text。其中 5 个是域名+IP 混合集，声明成 domain/ipcidr 会装不下。
#   - Loyalsoldier direct.txt 是 YAML 文件: 第一行 "payload:"，其后每行 "- '+.domain'"
#     → 必须 behavior: domain + format: yaml。
#     (2026-11-23 事故: 曾写成 format: text, mihomo 把 "- '+.xxx'" 整行当域名, 11 万条全部报
#      "skip invalid domain … wildcard must occupy the entire label" 被跳过; ruleCount 仍显示 11 万,
#      所以不能只看 ruleCount, 必须看内核日志里有没有 warning。)
#   声明错的后果不是报错，而是静默失效。
