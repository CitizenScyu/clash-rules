proxy-groups:
  # ---------- 分组严格 3 个，对齐 DNS.ini ----------
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    include-all: true          # 原版 .* 槽位 = 展开所有节点
    filter: "^(?!🤖|♻️)"       # 排除分组自身防环（include-all 会带入其他分组，这里排除组名）
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: "^(?!🚀|🤖|♻️)"
    # 【相对 DNS.ini 的新增项】原版为 .* 不过滤。这里只剔除机场塞进节点列表的「说明文字假节点」，
    # 避免 url-test 把延迟探测打到假节点上。只用精确短语，不用「时间」「群」这类单字词
    # （实测会误伤「香港 v2-时间优化」「香港 BGP-群聊专线」等真实节点名）。
    # 不想要这层过滤就删掉本行。
    exclude-filter: "剩余流量|套餐到期|距离下次重置|过期时间|官网|更新订阅|Traffic"
  - name: 🤖 OPenAI
    type: select
    proxies:
      - 🚀 节点选择
      - REJECT
    include-all: true
    filter: "^(?!🚀|♻️|🤖)"

