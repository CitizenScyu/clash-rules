proxy-groups:
  # ---------- 分组严格 3 个，对齐 DNS.ini ----------
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    include-all: true          # 原版 .* 槽位 = 展开所有节点
    filter: "^(?!🤖|♻️)"       # 排除分组自身防环（include-all 会带入其他分组，这里排除组名）
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: "^(?!🚀|🤖|♻️)"
    exclude-filter: "过期|到期|剩余流量|时间|重置|群|Telegram|流量|套餐|过期"
  - name: 🤖 OPenAI
    type: select
    proxies:
      - 🚀 节点选择
      - REJECT
    include-all: true
    filter: "^(?!🚀|♻️|🤖)"

rules:
  # ========== 1. 广告拦截（前置，避免被 direct.txt 误判） ==========
  - RULE-SET,BanAD,REJECT
  - RULE-SET,BanProgramAD,REJECT

